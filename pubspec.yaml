name: anime_app
description: A flutter anime watch app
publish_to: none

version: 1.5.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  anitube_crawler_api:
    path: ../anitube_crawler_api

  provider: ^6.1.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  carousel_pro_nullsafety: ^1.0.2
  wakelock: ^0.6.2
  random_color: ^1.0.6-nullsafety
  sqflite: ^2.4.1
  path: ^1.9.0
  bot_toast: ^4.1.3
  flutter_svg: ^2.0.17
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0
  intl: any
  package_info_plus: ^8.1.2
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mobx_codegen: ^2.6.1
  build_runner: ^2.4.13
  test: any

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/font/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/Poppins-Black.ttf
        - asset: assets/font/Poppins-Bold.ttf
        - asset: assets/font/Poppins-Regular.ttf